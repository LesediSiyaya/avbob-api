kind = "api"
previewPath = "/avbob-api"
title = "AVBOB Backend"
version = "1.0.0"
id = "avbob-backend-python-api"

[[services]]
localPort = 5000
name = "AVBOB Backend"
paths = ["/avbob-api"]

[services.development]
run = "cd /home/runner/workspace/artifacts/avbob-backend && uvicorn main:app --host 0.0.0.0 --port 5000 --reload"

[services.production]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/artifacts/avbob-backend && uvicorn main:app --host 0.0.0.0 --port 5000 --workers 1"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/avbob-api/health"
