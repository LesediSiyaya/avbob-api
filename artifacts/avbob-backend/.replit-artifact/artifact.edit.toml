kind = "api"
previewPath = "/"
title = "AVBOB Lead Assistant"
version = "1.0.0"

[[services]]
localPort = 5000
name = "AVBOB Backend"
paths = ["/"]

[services.development]
run = "cd artifacts/avbob-backend && uvicorn main:app --host 0.0.0.0 --port 5000 --reload"

[services.production]

[services.production.build]
args = ["echo", "no build step"]

[services.production.run]
args = ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000"]
workingDir = "artifacts/avbob-backend"

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/health"
